# The live demo — a Render Blueprint (ROADMAP P1, ADR-0003).
#
# One free web service built from the repository's Dockerfile: apps/server serving the API, the
# public fairness records and the web app from one origin. Free because a portfolio demo should
# cost nothing to keep up; the price, stated in ADR-0003 and the README, is a spin-down after 15
# idle minutes and no persistent disk — so every boot is a fresh table: fresh play-money wallets, an
# empty history, and verification links that last as long as the boot that dealt them.
#
# No secrets. PORT is injected by Render and read by the server; every value below is a choice
# this host makes about the demo, not a credential.

services:
  - type: web
    name: blackjack-demo
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Answers once the store answers.
    healthCheckPath: /ready
    # Deploy only commits CI has passed — the demo is never a build `pnpm check` or the E2E rejected.
    autoDeployTrigger: checksPass
    envVars:
      # The network lab: latency, lost replies, refusals — on the visitor's own session only
      # (docs/protocol.md §9). Forced shoes stay off: this is a production server.
      - key: BJ_FAULTS
        value: 'on'
